name: Metrics
on:
  # Agenda a atualização automática a cada 12 horas
  schedule: [{cron: "0 */12 * * *"}]
  # Permite que você force a atualização manualmente quando quiser
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Usa o token automático do próprio GitHub Actions
          token: ${{ secrets.GITHUB_TOKEN }}

          # Configurações do que vai aparecer
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # Plugin de Linguagens Automáticas
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
